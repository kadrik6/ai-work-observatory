name: hanked

# AI- ja andmehangete tuvastus (KURSUS, haru hanked/*). Laeb avalikud hankeandmed (TED, riigihangete
# register, OpenTender), koostab põhitabeli, märgendab ja hindab. Ainult lugemisõigus: repo ei muutu.
# Tulemus on logis (read "HANKED ...") ja artefaktis 30 päeva.

on:
  workflow_dispatch:
  push:
    branches: ["hanked/**"]
    paths: ["hanked/**", ".github/workflows/hanked.yml"]

permissions:
  contents: read

concurrency:
  group: hanked-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hanked:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: valjund/toores
          key: hanked-toores-v1-${{ github.run_id }}
          restore-keys: hanked-toores-v1-
      - run: pip install -r hanked/requirements.txt
      - name: Laadimine ja põhitabel
        run: python hanked/lae.py --valjund valjund
      - name: Kirjeldus ja märgendamise valim
        run: python hanked/kirjelda.py --valjund valjund
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hanked
          path: |
            valjund/*.jsonl*
          retention-days: 30
          if-no-files-found: warn
