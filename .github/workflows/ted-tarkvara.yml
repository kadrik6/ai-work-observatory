name: ted-tarkvara

# TED: tarkvarahanked Euroopas tootja kaupa (Microsoft vs alternatiivid). Logisse read "TED ...". Ainult lugemine.

on:
  workflow_dispatch:
  push:
    branches: ["tarkvara/**"]
    paths: ["hanked/ted_tarkvara.py", ".github/workflows/ted-tarkvara.yml"]

permissions:
  contents: read

jobs:
  ted:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python hanked/ted_tarkvara.py
